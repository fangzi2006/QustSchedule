name: Build and Release

on:
  # 推送以 v 开头的标签（如 v1.1.2）时自动编译并发布
  push:
    tags:
      - 'v*'
  # 也可以在 GitHub Actions 页面手动点击运行
  workflow_dispatch:

# 并发控制：同一分支/标签重复触发时，若非正式发版标签则自动取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write # 允许自动创建 Release 并上传文件

env:
  FLUTTER_VERSION: '3.47.7'
  # 判断是否为正式版（标签名不含 -beta / -rc 等连字符）
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  # ================= 1. 编译 Android APK =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21：本地用 JDK 25（对 CI 偏新），改用 21 尽量贴近本地编译结果；
      # 21 满足 AGP 9.x 官方最低要求 17，本项目 AGP 9.1.0 + Gradle 9.3.1、编译目标 Java 17。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 使用 Gradle 官方缓存加速构建
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 只接受 Android SDK 许可证；所需的 platform（如 compileSdk 对应的 android-37）
      # 交由 AGP 在构建期按需自动下载（AGP 7.0+ 标准行为，免在 CI 里写死版本号）。
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 始终执行；若有 KEYSTORE_BASE64 secret 则用正式签名，否则退回 debug 签名。
      # 注意：step 级 if 不允许引用 secrets 上下文，故改为在脚本里判空，
      # 这样无论配没配 secret 都不会因 if 表达式非法而整条 workflow 启动失败。
      - name: Restore Android Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "KEYSTORE_BASE64 secret 未配置，将使用 debug 签名（仍可产出 apk，但不能覆盖升级已装的 release 包）。"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, universal)
        run: flutter build apk --release

      # gradle 的 afterEvaluate 已经把产物复制成「青科课表通_v<version>.apk」；
      # 这里用更稳健的方式解析版本号（去掉冒号后空白与 CRLF）并兜底查找产物。
      - name: Collect Android artifact
        id: vars
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          TARGET_APK="dist/青科课表通_v${VERSION}.apk"
          if [ -f "build/app/outputs/flutter-apk/青科课表通_v${VERSION}.apk" ]; then
            cp "build/app/outputs/flutter-apk/青科课表通_v${VERSION}.apk" "$TARGET_APK"
          elif [ -f "build/app/outputs/apk/release/青科课表通_v${VERSION}.apk" ]; then
            cp "build/app/outputs/apk/release/青科课表通_v${VERSION}.apk" "$TARGET_APK"
          else
            cp "build/app/outputs/flutter-apk/app-release.apk" "$TARGET_APK"
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: dist/*.apk
          if-no-files-found: error

  # ================= 2. 编译 Windows 客户端 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # windows-latest 当前镜像已预装 Inno Setup 6（iscc 在 PATH）；
      # 仅当未发现时才 choco 安装，兼容旧镜像与未来变动。
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows Installer & Zip
        shell: pwsh
        run: |
          $Version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','').Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. 编译 Inno Setup 安装包并直接输出到 dist 目录（/O"dist" 覆盖脚本里的 OutputDir）
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$Version /O"dist" "windows\packaging\setup.iss"

          # 2. 打包免安装便携版 Zip 到 dist 目录
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/青科课表通_v${Version}-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # ================= 3. 汇总并自动发布到 GitHub Releases =================
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      # 生成所有安装包的 SHA256 校验值文件
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 标签触发时用推送的标签名；手动触发时按 pubspec 版本号自动建标签
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 青科课表通 v${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true # 配合 .github/release.yml 自动生成分类更新日志
          draft: false
          prerelease: ${{ env.IS_STABLE != 'true' }}
