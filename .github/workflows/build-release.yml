name: Build and Release

on:
  # 推送以 v 开头的标签（如 v1.1.2）时自动编译并发布
  push:
    tags:
      - 'v*'
  # 也可以在 GitHub Actions 页面手动点击运行
  workflow_dispatch:

permissions:
  contents: write # 允许自动创建 Release 并上传文件

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # ================= 1. 编译 Android APK =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21：本地用 JDK 25（对 CI 偏新），改用 21 尽量贴近本地编译结果；
      # 21 满足 AGP 9.x 官方最低要求 17，本项目 AGP 9.1.0 + Gradle 9.3.1、编译目标 Java 17。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android SDK (platform-37 / build-tools 36.0.0)
        uses: android-actions/setup-android@v3

      # 显式安装本项目用到的 platform-37 / build-tools;36.0.0，避免依赖 Gradle 在构建期
      # 自动拉取（更确定、更快、且不受网络/许可异常影响）。先接受全部许可证。
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      # 始终执行；若有 KEYSTORE_BASE64 secret 则用正式签名，否则退回 debug 签名。
      # 注意：step 级 if 不允许引用 secrets 上下文，故改为在脚本里判空，
      # 这样无论配没配 secret 都不会因 if 表达式非法而整条 workflow 启动失败。
      - name: Restore Android Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=$KEY_STORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          else
            echo "KEYSTORE_BASE64 secret 未配置，将使用 debug 签名（仍可产出 apk，但不能覆盖升级已装的 release 包）。"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, universal)
        run: flutter build apk --release

      # gradle 的 afterEvaluate 已经把产物复制成「青科课表通_v<version>.apk」；
      # 这里用更稳健的方式解析版本号（去掉冒号后空白与 CRLF）并兜底查找产物。
      - name: Collect Android artifact
        id: vars
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release_assets
          TARGET_APK="release_assets/青科课表通_v${VERSION}.apk"
          if [ -f "build/app/outputs/flutter-apk/青科课表通_v${VERSION}.apk" ]; then
            cp "build/app/outputs/flutter-apk/青科课表通_v${VERSION}.apk" "$TARGET_APK"
          elif [ -f "build/app/outputs/apk/release/青科课表通_v${VERSION}.apk" ]; then
            cp "build/app/outputs/apk/release/青科课表通_v${VERSION}.apk" "$TARGET_APK"
          else
            cp "build/app/outputs/flutter-apk/app-release.apk" "$TARGET_APK"
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release_assets/*.apk
          if-no-files-found: error

  # ================= 2. 编译 Windows 客户端 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # windows-latest 当前镜像已预装 Inno Setup 6（iscc 在 PATH）；
      # 仅当未发现时才 choco 安装，兼容旧镜像与未来变动。
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $Version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','').Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$Version /O"build\windows\installer" "windows\packaging\setup.iss"

      - name: Package Windows Zip
        shell: pwsh
        run: |
          $Version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','').Trim()
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "青科课表通_v${Version}-windows-x64.zip" -Force

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/installer/*.exe
          if-no-files-found: error

      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "青科课表通_v*-windows-x64.zip"
          if-no-files-found: error

  # ================= 3. 汇总并自动发布到 GitHub Releases =================
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # merge-multiple: true 把各 artifact 平铺到 artifacts/ 根目录，便于直接上传
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 标签触发时用推送的标签名；手动触发时按 pubspec 版本号自动建标签
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 青科课表通 v${{ steps.ver.outputs.version }}
          files: artifacts/*
          generate_release_notes: true # 自动从 commit 记录生成更新日志
          draft: false
          prerelease: false
