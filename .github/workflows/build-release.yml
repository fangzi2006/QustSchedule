name: Build and Release

on:
  # 推送以 v 开头的标签（如 v1.1.2）时自动编译并发布
  push:
    tags:
      - 'v*'
  # 也可以在 GitHub Actions 页面手动点击运行
  workflow_dispatch:

# 并发控制：同一分支/标签重复触发时，若非正式发版标签则自动取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write # 允许自动创建 Release 并上传文件

env:
  FLUTTER_VERSION: '3.47.7'
  # 判断是否为正式版（标签名不含 -beta / -rc 等连字符）
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  # ================= 1. 编译 Android APK =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21：本地用 JDK 25（对 CI 偏新），改用 21 尽量贴近本地编译结果；
      # 21 满足 AGP 9.x 官方最低要求 17，本项目 AGP 9.1.0 + Gradle 9.3.1、编译目标 Java 17。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 使用 Gradle 官方缓存加速构建
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 只接受 Android SDK 许可证；所需的 platform（如 compileSdk 对应的 android-37）
      # 交由 AGP 在构建期按需自动下载（AGP 7.0+ 标准行为，免在 CI 里写死版本号）。
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 始终执行；若有 KEYSTORE_BASE64 secret 则用正式签名，否则退回 debug 签名。
      # 注意：step 级 if 不允许引用 secrets 上下文，故改为在脚本里判空，
      # 这样无论配没配 secret 都不会因 if 表达式非法而整条 workflow 启动失败。
      - name: Restore Android Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "KEYSTORE_BASE64 secret 未配置，将使用 debug 签名（仍可产出 apk，但不能覆盖升级已装的 release 包）。"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: "Build APK (release, split by ABI: arm64-v8a + armeabi-v7a)"
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # gradle 的 afterEvaluate 已把每个 ABI 产物复制成「青科课表通_v<version>-<abi>.apk」；
      # 这里把所有带版本号前缀的 APK 一并收集进 dist/（拆分后会有 v7 / v8 两个）。
      - name: Collect Android artifacts
        id: vars
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          shopt -s nullglob
          SRC_APKS=(build/app/outputs/flutter-apk/QustSchedule_v${VERSION}*.apk)
          if [ ${#SRC_APKS[@]} -gt 0 ]; then
            cp "${SRC_APKS[@]}" dist/
            echo "Collected APKs: ${SRC_APKS[*]##*/}"
          else
            # 兜底：直接找 AGP 原始拆分产物
            cp build/app/outputs/flutter-apk/app-*-release.apk dist/ 2>/dev/null || true
            echo "未找到带版本号前缀的副本，已兜底复制 AGP 拆分产物"
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: dist/*.apk
          if-no-files-found: error

  # ================= 2. 编译 Windows 客户端 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      # windows-latest 当前镜像已预装 Inno Setup 6（iscc 在 PATH）；
      # 仅当未发现时才 choco 安装，兼容旧镜像与未来变动。
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows Installer & Zip
        shell: pwsh
        run: |
          $Version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','').Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. 编译 Inno Setup 安装包并直接输出到 dist 目录（/O"dist" 覆盖脚本里的 OutputDir）
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$Version /O"dist" "windows\packaging\setup.iss"

          # 2. 打包免安装便携版 Zip 到 dist 目录
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/QustSchedule_v${Version}-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # ================= 3. 汇总并自动发布到 GitHub Releases =================
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 取全部标签，用于生成「所有变更列表」的对比链接

      - name: Compute version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      # 生成所有安装包的 SHA256 校验值文件
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # 组装 Release 正文：简介 → 下载表格 → 变更列表链接。
      # 简介来源：仓库 .github/release_notes.md（发版前编辑即可自定义），没有则用默认一句。
      - name: Build release body
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ -s .github/release_notes.md ]; then
            CUSTOM_NOTES="$(cat .github/release_notes.md)"
          else
            CUSTOM_NOTES=""
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          enc() { python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$1"; }

          # 上一个标签，用于「所有变更列表」的对比链接（首次发布退回提交历史）
          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "$TAG" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_URL="https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGELOG_URL="https://github.com/${REPO}/commits/${TAG}"
          fi

          {
            if [ -n "$CUSTOM_NOTES" ]; then
              printf '%s\n' "$CUSTOM_NOTES"
            else
              echo "青科课表通 v${VERSION} 发布。青岛科技大学教务系统第三方课表客户端，本版更新内容见下方更新日志。"
            fi
            echo
            echo "## 📥 根据你的操作系统下载"
            echo
            echo "| OS | 下载 | 使用加速代理下载 |"
            echo "|:--:|:--|:--|"
            echo "| **安卓** | [![APK ARMv8](https://img.shields.io/badge/APK-ARMv8-3DDC84)](${BASE}/QustSchedule_v${VERSION}-arm64-v8a.apk)<br>[![APK ARMv7](https://img.shields.io/badge/APK-ARMv7-3DDC84)](${BASE}/QustSchedule_v${VERSION}-armeabi-v7a.apk) | [![APK ARMv8](https://img.shields.io/badge/APK-ARMv8-3DDC84)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-arm64-v8a.apk)<br>[![APK ARMv7](https://img.shields.io/badge/APK-ARMv7-3DDC84)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-armeabi-v7a.apk) |"
            echo "| **Windows** | [![Setup x64](https://img.shields.io/badge/Setup-x64-0078D6)](${BASE}/QustSchedule_v${VERSION}-windows-x64-setup.exe)<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-0078D6)](${BASE}/QustSchedule_v${VERSION}-windows-x64.zip) | [![Setup x64](https://img.shields.io/badge/Setup-x64-0078D6)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-windows-x64-setup.exe)<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-0078D6)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-windows-x64.zip) |"
            echo
            echo "所有变更列表：[ChangeLog](${CHANGELOG_URL})"
          } > body.md
          echo "---- body.md ----"
          cat body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 标签触发时用推送的标签名；手动触发时按 pubspec 版本号自动建标签
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 青科课表通 v${{ steps.ver.outputs.version }}
          body_path: body.md
          files: dist/*
          draft: false
          prerelease: ${{ env.IS_STABLE != 'true' }}
