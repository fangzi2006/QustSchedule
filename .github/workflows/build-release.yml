name: CI / Build and Release

on:
  push:
    branches:
      - main
      - master
    # 只有改了源码 / 测试 / 平台工程 / 依赖 / 工作流才触发；改文档不触发。
    paths:
      - 'lib/**'
      - 'test/**'
      - 'packages/**'
      - 'android/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'test/**'
      - 'packages/**'
      - 'android/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/**'
  workflow_dispatch:

# 并发控制：
# 1. 推送标签（v*）：cancel-in-progress = false，发版任务绝不被新提交打断；
# 2. 普通提交：cancel-in-progress = true，有新提交时直接中断旧任务，转去跑最新提交。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write # 创建 Release 并上传产物
  actions: write  # 测试失败时取消本次运行（fail-fast）

env:
  FLUTTER_VERSION: '3.47.7'
  IS_STABLE: ${{ !contains(github.ref, '-') }}

# 流水线结构（三个 job 同时起跑，测试失败即整体取消）：
#
#   test ──────────(~70s)──┐ 失败 → gh run cancel，正在打的包全部中止、不产出 Artifact
#   build-android ─(~3min)─┼─→ create-release（仅 v* 标签；needs 三者全部成功）
#   build-windows ─(~3min)─┘
#
# 为什么不让打包 needs: test：测试 ~70s 会整段串在打包前面（实测总时长 3m40s → 5m38s）。
# 并行 + 失败即取消，效果等价——测试不过就没有安装包、也不会发版——但测试时间被打包时间完全覆盖。
#
# Flutter SDK 缓存：只用 subosito/flutter-action 自带的 cache: true（默认 key，已有缓存直接命中）。
# 不要再额外套 actions/cache 缓存同一目录：那会让每个 job 多一次 ~1GB 的还原和上传（实测 +30~60s）。

jobs:
  # ================= 1. 测试门禁：语法检查 → 固定基本测试 → 自定义测试 =================
  test:
    name: "Tests (Lint, Core & Custom)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies (Main & zf_academic)
        run: |
          flutter pub get
          (cd packages/zf_academic && dart pub get)

      # --- 快速语法检查 ---
      - name: "Lint: Format check"
        run: |
          dart format --output=none --set-exit-if-changed lib test
          (cd packages/zf_academic && dart format --output=none --set-exit-if-changed lib test)

      - name: "Lint: Static analysis (Main project)"
        run: flutter analyze --no-fatal-infos lib test

      - name: "Lint: Static analysis (zf_academic package)"
        run: (cd packages/zf_academic && flutter analyze --no-fatal-infos lib test)

      # --- 固定基本测试项 ---
      - name: "Core Test: Protocol tests (zf_academic)"
        run: (cd packages/zf_academic && dart test)

      # 单元 / 状态机 / 界面合并为一次 flutter test：只编译、启动一次测试进程，文件间并发执行。
      # 排除 test/custom/，它由下一步单独跑。
      - name: "Core Test: Unit, State machine & Widget tests"
        run: flutter test $(find test -maxdepth 1 -name '*_test.dart' | sort)

      # --- 自定义测试项：test/custom/ 下有 *_test.dart 才跑 ---
      - name: "Custom Test: Run test/custom if present"
        run: |
          if [ -n "$(find test/custom -type f -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "::notice::检测到 test/custom/ 下的自定义测试，开始运行"
            flutter test test/custom
          else
            echo "test/custom/ 下没有测试项，跳过"
          fi

      # --- fail-fast：测试失败时取消整个运行，并行中的打包随之中止 ---
      - name: Cancel workflow on test failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ================= 2. 编译 Android APK（与测试、Windows 同时起跑） =================
  build-android:
    name: "Build Android APK"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # cache-cleanup: never —— 默认在 Post 阶段跑一次 Gradle 清理缓存，实测白耗 36~55s。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Restore Android Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "正在从 secrets 还原发布证书..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "未配置 KEYSTORE_BASE64 secret，将使用 debug 签名。"
          fi

      # flutter build 会自动执行 pub get，不再单独跑一步。
      - name: "Build APK (release, split by ABI: arm64-v8a + armeabi-v7a)"
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Collect Android artifacts
        id: collect
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          mkdir -p dist
          shopt -s nullglob
          SRC_APKS=(build/app/outputs/flutter-apk/QustSchedule_v${VERSION}*.apk)
          if [ ${#SRC_APKS[@]} -gt 0 ]; then
            cp "${SRC_APKS[@]}" dist/
            echo "Collected APKs: ${SRC_APKS[*]##*/}"
          else
            cp build/app/outputs/flutter-apk/app-*-release.apk dist/ 2>/dev/null || true
            echo "未找到版本前缀 APK，已复制 AGP 拆分产物"
          fi
          ARM64=$(ls dist/*arm64-v8a*.apk 2>/dev/null | head -1)
          ARMV7=$(ls dist/*armeabi-v7a*.apk 2>/dev/null | head -1)
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "armv7=$ARMV7" >> "$GITHUB_OUTPUT"

      # 单文件直接上传，archive: false 使得在 Actions 页面点击可直接下载安装包本身（非 zip 压缩包）
      - name: Upload Android APK (arm64-v8a)
        if: steps.collect.outputs.arm64 != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.collect.outputs.arm64 }}
          archive: false
          if-no-files-found: error

      - name: Upload Android APK (armeabi-v7a)
        if: steps.collect.outputs.armv7 != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.collect.outputs.armv7 }}
          archive: false
          if-no-files-found: error

  # ================= 3. 编译 Windows 客户端（与测试、Android 同时起跑） =================
  build-windows:
    name: "Build Windows Client"
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      # Windows 上解压 Flutter SDK（几十万个小文件）的大头是 Defender 实时扫描，先关掉。
      - name: Disable Windows Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # flutter build 会自动执行 pub get，不再单独跑一步。
      - name: Build Windows Release
        run: flutter build windows --release

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows Installer & Zip
        id: package
        shell: pwsh
        run: |
          $Version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','').Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. Inno Setup 安装包直接输出到 dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$Version /O"dist" "windows\packaging\setup.iss"

          # 2. 便携版 Zip
          $ZipPath = "dist/QustSchedule_v${Version}-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $ZipPath -Force

          $SetupPath = (Get-ChildItem -Path dist -Filter "*setup.exe" | Select-Object -First 1).FullName
          "setup=$SetupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$ZipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 单文件上传，archive: false 避免在外层再套一层 zip 压缩包
      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.setup }}
          archive: false
          if-no-files-found: error

      - name: Upload Windows Portable Zip (.zip)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          if-no-files-found: error

  # ================= 4. 发布 GitHub Release（仅 v* 标签，且测试与双端打包全部成功） =================
  create-release:
    name: "Create GitHub Release"
    needs: [test, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Build release body
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          # 优先从 CHANGELOG.md 中提取当前版本的更新说明
          CUSTOM_NOTES=$(python3 -c "
          import re, os
          version = os.environ.get('VERSION', '').lstrip('v')
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'## \\[?v?{re.escape(version)}\\]?.*?\\n(.*?)(?=\\n## |\\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  print(match.group(1).strip())
          " 2>/dev/null || true)

          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_URL="https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGELOG_URL="https://github.com/${REPO}/commits/${TAG}"
          fi

          {
            if [ -n "$CUSTOM_NOTES" ]; then
              printf '%s\n' "$CUSTOM_NOTES"
            else
              echo "青科课表通 v${VERSION} 发布。青岛科技大学教务系统第三方课表客户端，本版更新内容见下方变更列表。"
            fi
            echo
            echo "## 📥 根据你的操作系统下载"
            echo
            echo "| OS | 下载 | 使用加速代理下载 |"
            echo "|:--:|:--|:--|"
            echo "| **安卓** | [![APK ARMv8](https://img.shields.io/badge/APK-ARMv8-3DDC84)](${BASE}/QustSchedule_v${VERSION}-arm64-v8a.apk)<br>[![APK ARMv7](https://img.shields.io/badge/APK-ARMv7-3DDC84)](${BASE}/QustSchedule_v${VERSION}-armeabi-v7a.apk) | [![APK ARMv8](https://img.shields.io/badge/APK-ARMv8-3DDC84)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-arm64-v8a.apk)<br>[![APK ARMv7](https://img.shields.io/badge/APK-ARMv7-3DDC84)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-armeabi-v7a.apk) |"
            echo "| **Windows** | [![Setup x64](https://img.shields.io/badge/Setup-x64-0078D6)](${BASE}/QustSchedule_v${VERSION}-windows-x64-setup.exe)<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-0078D6)](${BASE}/QustSchedule_v${VERSION}-windows-x64.zip) | [![Setup x64](https://img.shields.io/badge/Setup-x64-0078D6)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-windows-x64-setup.exe)<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-0078D6)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-windows-x64.zip) |"
            echo
            echo "所有变更列表：[ChangeLog](${CHANGELOG_URL})"
          } > body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 青科课表通 v${{ steps.ver.outputs.version }}
          body_path: body.md
          files: dist/*
          draft: false
          prerelease: ${{ env.IS_STABLE != 'true' }}
