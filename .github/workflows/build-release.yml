name: CI / Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# 并发控制：
# 1. 若为推送标签（v* 开头），cancel-in-progress 为 false，绝不被打断，保证发版任务完整跑完；
# 2. 若为普通分支提交，cancel-in-progress 为 true，若出现新提交则直接中断旧任务，立即运行最新提交。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write # 允许创建 Release 并上传产物

env:
  FLUTTER_VERSION: '3.47.7'
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  # ================= 1. 测试门禁（语法检查、固定基本测试、自定义测试） =================
  test:
    name: "Tests (Lint, Core & Custom)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies (Main & zf_academic)
        run: |
          flutter pub get
          (cd packages/zf_academic && dart pub get)

      # --- 快速语法检查 (Fast Lint / Static Analysis) ---
      - name: "Lint: Format check (Main project)"
        run: dart format --output=none --set-exit-if-changed lib test

      - name: "Lint: Format check (zf_academic package)"
        run: (cd packages/zf_academic && dart format --output=none --set-exit-if-changed lib test)

      - name: "Lint: Static analysis (Main project)"
        run: flutter analyze --no-fatal-infos lib test

      - name: "Lint: Static analysis (zf_academic package)"
        run: (cd packages/zf_academic && flutter analyze --no-fatal-infos lib test)

      # --- 固定基本测试项 (Core Tests) ---
      - name: "Core Test: Protocol tests (zf_academic)"
        run: (cd packages/zf_academic && dart test)

      - name: "Core Test: Unit & State machine tests"
        run: |
          flutter test test/app_version_test.dart \
                       test/term_calendar_test.dart \
                       test/timetable_test.dart \
                       test/schedule_service_test.dart \
                       test/app_model_test.dart

      - name: "Core Test: Widget & Invariant sweep tests"
        run: flutter test test/widget_test.dart

      # --- 预留自定义测试项 (Custom Tests) ---
      - name: "Custom Test: Run test/custom if present"
        run: |
          if [ -d "test/custom" ] && [ -n "$(find test/custom -type f -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
            echo "::notice::在 test/custom/ 目录下检测到自定义测试项，开始运行..."
            flutter test test/custom
          else
            echo "未在 test/custom/ 目录下检测到测试项，跳过自定义测试。"
          fi

  # ================= 2. 编译 Android APK =================
  build-android:
    name: "Build Android APK"
    needs: [test]
    # 只要不是 Pull Request（普通分支提交或 Tag 推送），测试通过后均执行打包
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Restore Android Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "正在从 secrets 还原发布证书..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "未配置 KEYSTORE_BASE64 secret，将使用 debug 签名。"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: "Build APK (release, split by ABI: arm64-v8a + armeabi-v7a)"
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Collect Android artifacts
        id: vars
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          shopt -s nullglob
          SRC_APKS=(build/app/outputs/flutter-apk/QustSchedule_v${VERSION}*.apk)
          if [ ${#SRC_APKS[@]} -gt 0 ]; then
            cp "${SRC_APKS[@]}" dist/
            echo "Collected APKs: ${SRC_APKS[*]##*/}"
          else
            cp build/app/outputs/flutter-apk/app-*-release.apk dist/ 2>/dev/null || true
            echo "未找到版本前缀 APK，已复制 AGP 拆分产物"
          fi

      - name: Upload Android Artifact (供在 Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: dist/*.apk
          if-no-files-found: error

  # ================= 3. 编译 Windows 客户端 =================
  build-windows:
    name: "Build Windows Client"
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package Windows Installer & Zip
        shell: pwsh
        run: |
          $Version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -replace '\+.*','').Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. 编译 Inno Setup 安装包直接输出到 dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$Version /O"dist" "windows\packaging\setup.iss"

          # 2. 打包便携版 Zip 到 dist
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/QustSchedule_v${Version}-windows-x64.zip" -Force

      - name: Upload Windows Artifacts (供在 Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # ================= 4. 汇总并自动发布到 GitHub Releases (仅推送标签触发) =================
  create-release:
    name: "Create GitHub Release"
    needs: [build-android, build-windows]
    # 严格限定：只有推送 v* 标签时才创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Build release body
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ -s .github/release_notes.md ]; then
            CUSTOM_NOTES="$(cat .github/release_notes.md)"
          else
            CUSTOM_NOTES=""
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "$TAG" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_URL="https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            CHANGELOG_URL="https://github.com/${REPO}/commits/${TAG}"
          fi

          {
            if [ -n "$CUSTOM_NOTES" ]; then
              printf '%s\n' "$CUSTOM_NOTES"
            else
              echo "青科课表通 v${VERSION} 发布。青岛科技大学教务系统第三方课表客户端，本版更新内容见下方更新日志。"
            fi
            echo
            echo "## 📥 根据你的操作系统下载"
            echo
            echo "| OS | 下载 | 使用加速代理下载 |"
            echo "|:--:|:--|:--|"
            echo "| **安卓** | [![APK ARMv8](https://img.shields.io/badge/APK-ARMv8-3DDC84)](${BASE}/QustSchedule_v${VERSION}-arm64-v8a.apk)<br>[![APK ARMv7](https://img.shields.io/badge/APK-ARMv7-3DDC84)](${BASE}/QustSchedule_v${VERSION}-armeabi-v7a.apk) | [![APK ARMv8](https://img.shields.io/badge/APK-ARMv8-3DDC84)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-arm64-v8a.apk)<br>[![APK ARMv7](https://img.shields.io/badge/APK-ARMv7-3DDC84)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-armeabi-v7a.apk) |"
            echo "| **Windows** | [![Setup x64](https://img.shields.io/badge/Setup-x64-0078D6)](${BASE}/QustSchedule_v${VERSION}-windows-x64-setup.exe)<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-0078D6)](${BASE}/QustSchedule_v${VERSION}-windows-x64.zip) | [![Setup x64](https://img.shields.io/badge/Setup-x64-0078D6)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-windows-x64-setup.exe)<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-0078D6)](https://gh-proxy.com/${BASE}/QustSchedule_v${VERSION}-windows-x64.zip) |"
            echo
            echo "所有变更列表：[ChangeLog](${CHANGELOG_URL})"
          } > body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 青科课表通 v${{ steps.ver.outputs.version }}
          body_path: body.md
          files: dist/*
          draft: false
          prerelease: ${{ env.IS_STABLE != 'true' }}
