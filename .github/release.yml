# 自动生成 Release 更新日志时的分类规则（配合 workflow 的 generate_release_notes: true）
changelog:
  exclude:
    labels:
      - 'chore'
      - 'ci'
      - 'docs'
      - 'skip-changelog'
  categories:
    - title: 🚀 新功能
      labels:
        - 'feature'
        - 'enhancement'
    - title: 🐛 问题修复
      labels:
        - 'fix'
        - 'bug'
    - title: 🔧 优化与重构
      labels:
        - 'refactor'
        - 'perf'
        - 'style'
    - title: 📦 其他
      labels:
        - '*'
